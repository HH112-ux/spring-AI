<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十指波课堂 AI 聊天助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 800px;
            height: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: white;
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .chat-input-form {
            display: flex;
            gap: 12px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #sendButton:active {
            transform: translateY(0);
        }

        #sendButton:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .typing {
            display: inline-block;
            padding: 8px 12px;
        }

        .typing::after {
            content: '...';
            animation: typing 1.5s steps(4, end) infinite;
        }

        @keyframes typing {
            0%, 100% {
                content: '';
            }
            25% {
                content: '.';
            }
            50% {
                content: '..';
            }
            75% {
                content: '...';
            }
        }

        .welcome-message {
            text-align: center;
            color: #666;
            padding: 40px 20px;
        }

        .welcome-message h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #333;
        }

        .welcome-message p {
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h1>AI 聊天助手</h1>
        <p>基于 Spring AI 和 DeepSeek 的智能对话系统（流式响应）</p>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="welcome-message">
            <h2>欢迎使用 AI 聊天助手！</h2>
            <p>请在下方输入您的问题，我会尽力为您解答。</p>
        </div>
    </div>

    <div class="chat-input-container">
        <form class="chat-input-form" id="chatForm">
            <input type="text" id="messageInput" placeholder="输入您的问题..." autocomplete="off" required>
            <button type="submit" id="sendButton">发送</button>
        </form>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const welcomeMessage = document.querySelector('.welcome-message');

    // 移除欢迎消息
    function removeWelcomeMessage() {
        if (welcomeMessage) {
            welcomeMessage.remove();
        }
    }

    // 添加消息到聊天界面
    function addMessage(content, isUser = false) {
        removeWelcomeMessage();

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

        const messageContent = document.createElement('div');
        messageContent.className = 'message-content';
        messageContent.textContent = content;

        messageDiv.appendChild(messageContent);
        chatMessages.appendChild(messageDiv);

        // 滚动到底部
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 添加加载消息
    function addLoadingMessage() {
        removeWelcomeMessage();

        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant';
        messageDiv.id = 'loadingMessage';

        const messageContent = document.createElement('div');
        messageContent.className = 'message-content typing';
        messageContent.textContent = 'AI 正在思考';

        messageDiv.appendChild(messageContent);
        chatMessages.appendChild(messageDiv);

        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 移除加载消息
    function removeLoadingMessage() {
        const loadingMessage = document.getElementById('loadingMessage');
        if (loadingMessage) {
            loadingMessage.remove();
        }
    }

    // 发送消息（流式响应）
    async function sendMessage(message) {
        addMessage(message, true);

        addLoadingMessage();
        sendButton.disabled = true;
        messageInput.disabled = true;

        try {
            const response = await fetch('/ai/chatStream', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({message: message})
            });

            if (!response.ok) {
                throw new Error('网络请求失败');
            }

            removeLoadingMessage();

            // 创建一个新的消息容器用于显示流式响应
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'currentStreamMessage';

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.textContent = '';

            messageDiv.appendChild(messageContent);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // 处理流式响应
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';

            while (true) {
                const {done, value} = await reader.read();

                if (done) break;

                // 解码并解析数据
                const chunk = decoder.decode(value, {stream: true});

                // 尝试解析 JSON 行
                const lines = chunk.split('\n').filter(line => line.trim());
                for (const line of lines) {
                    try {

                        // 移除可能的数据前缀（如 "data:"）
                        const cleanLine = line.replace(/^data:\s*/, '').trim();
                        if (!cleanLine) continue;

                        const data = cleanLine.replace(/,$/, '').trim();

                        if (data.response) {
                            fullText += data.response;
                            messageContent.textContent = fullText;
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        } else {
                            fullText += data;
                            messageContent.textContent = fullText;
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        }
                    } catch (e) {
                        console.warn('解析 JSON 失败:', e, line);
                        // 如果解析失败，尝试直接显示文本
                        if (chunk.trim()) {
                            fullText += chunk;
                            messageContent.textContent = fullText;
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        }
                    }
                }
            }

            // 移除当前消息的 ID 标记
            if (messageDiv) {
                messageDiv.removeAttribute('id');
            }

        } catch (error) {
            removeLoadingMessage();
            addMessage('抱歉，发生了错误：' + error.message, false);
        } finally {
            sendButton.disabled = false;
            messageInput.disabled = false;
            messageInput.focus();
        }
    }

    // 表单提交
    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const message = messageInput.value.trim();
        if (!message) return;

        messageInput.value = '';
        await sendMessage(message);
    });

    // 页面加载时聚焦输入框
    messageInput.focus();
</script>
</body>
</html>
